# Render Blueprint — رفع دائم 24/7 بدون الاعتماد على جهازك
# الاستخدام:
#   1) حرّر الأكواد محليًا ثم ارفع المجلد إلى مستودع GitHub عام
#   2) على Render.com: New -> Blueprint -> اختر المستودع
#      وسيكتشف تلقائيًا هذا الملف render.yaml وينشئ الخدمة + النطاق
# النتيجة: رابط ثابت https://<yourapp>.onrender.com يعمل من أي مكان
#
# بعد أول Deploy (مهم):
#   Service -> Environment -> أضف المتغيرات التالية ثم Save + Deploy:
#   APP_ENV=production (مضبوط) و GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / SECRET_KEY
#   و OAUTH_REDIRECT_URI=https://<رابطك>.onrender.com/api/auth/callback
#   (القيم جاهزة في ملف .env المحلي — لا نكتبها هنا لأن المستودع عام)
services:
  - type: web
    name: drive-doc-control
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
