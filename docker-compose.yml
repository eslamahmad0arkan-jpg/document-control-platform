services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drivedoc
      POSTGRES_PASSWORD: drivedoc_dev_pw
      POSTGRES_DB: drivedoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivedoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://drivedoc:drivedoc_dev_pw@db:5432/drivedoc
      SECRET_KEY: ${SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
      MONITOR_ENABLED: "true"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: lax
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

volumes:
  pgdata: